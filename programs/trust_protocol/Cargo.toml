[package]
name = "trust-protocol"
version = "0.1.0"
description = "Trust Protocol - Portable Reputation for AI Agents on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trust_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.29.0"
