name: Build Trust Protocol

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: backpackapp/build:v0.30.1
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: anchor build

      - name: Upload program
        uses: actions/upload-artifact@v4
        with:
          name: trust-protocol
          path: target/deploy/
